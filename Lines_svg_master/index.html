<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lines.SVG</title>
<style>
  :root { --bg:#f4f1ea; --ink:#1c1c1c; --accent:#e4572e; --panel:#fffdf8; }
  * { box-sizing:border-box; margin:0; }
  body { font-family: "Courier New", monospace; background:var(--bg); color:var(--ink);
         display:flex; flex-direction:column; height:100vh; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:12px 16px;
           border-bottom:2px solid var(--ink); background:var(--panel); }
  h1 { font-size:18px; margin-right:auto; letter-spacing:1px; }
  label { font-size:13px; display:flex; align-items:center; gap:6px; }
  button { font-family:inherit; font-size:13px; padding:8px 14px; border:2px solid var(--ink);
           background:var(--panel); cursor:pointer; }
  button:hover { background:var(--ink); color:var(--panel); }
  button.main { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.tool.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  main { flex:1; padding:16px; overflow:hidden; }
  .stage { position:relative; width:100%; height:100%; border:2px solid var(--ink);
           background:#fefefe; cursor:crosshair;
           background-image:
             linear-gradient(to right, #d0d0d0 1px, transparent 1px),
             linear-gradient(to bottom, #d0d0d0 1px, transparent 1px),
             linear-gradient(to right, #b0b0b0 2px, transparent 2px),
             linear-gradient(to bottom, #b0b0b0 2px, transparent 2px);
           background-size: 20px 20px, 20px 20px, 100px 100px, 100px 100px; }
  .stage canvas { position:absolute; top:0; left:0; display:block; }
  #overlay { pointer-events:none; }
</style>
</head>
<body>
<header>
  <h1>✏️ Lines.SVG</h1>
  <button class="tool active" data-tool="line">✏️ Line</button>
  <button class="tool" data-tool="bucket">🪣 Bucket</button>
  <label>Color <input type="color" id="color" value="#1c1c1c"></label>
  <label>Thickness <input type="range" id="width" min="1" max="20" value="3"> <span id="widthV">3</span></label>
  <label><input type="checkbox" id="grid" checked> Grid (snap)</label>
  <label><input type="checkbox" id="cont" checked> Continuous line</label>
  <button id="undo">Undo</button>
  <button id="clear">Clear</button>
  <button id="download" class="main">⬇ Download SVG</button>
</header>
<main>
  <div class="stage" id="stage">
    <canvas id="drawing"></canvas>
    <canvas id="overlay"></canvas>
  </div>
</main>

<script>
const stage = document.getElementById('stage');
const canvas = document.getElementById('drawing');
const overlay = document.getElementById('overlay');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const octx = overlay.getContext('2d');
const $ = id => document.getElementById(id);

let tool = 'line';
let start = null;
const undoStack = [];
const MAX_UNDO = 25;

$('width').oninput = e => $('widthV').textContent = e.target.value;

document.querySelectorAll('.tool').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tool').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    tool = btn.dataset.tool;
    stage.style.cursor = tool === 'bucket' ? 'cell' : 'crosshair';
    stop();
  });
});

function resize() {
  const r = stage.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const w = Math.round(r.width), h = Math.round(r.height);
  if (canvas.width === w * dpr && canvas.height === h * dpr) return;

  let tmp = null;
  if (canvas.width > 0 && canvas.height > 0) {
    tmp = document.createElement('canvas');
    tmp.width = canvas.width;
    tmp.height = canvas.height;
    tmp.getContext('2d').drawImage(canvas, 0, 0);
  }

  canvas.width = w * dpr;
  canvas.height = h * dpr;
  overlay.width = w * dpr;
  overlay.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  overlay.style.width = w + 'px';
  overlay.style.height = h + 'px';

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  octx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  octx.lineCap = 'round';
  octx.lineJoin = 'round';

  if (tmp) {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(tmp, 0, 0);
    ctx.restore();
  }
}

window.addEventListener('resize', resize);

function point(e) {
  const r = canvas.getBoundingClientRect();
  let x = e.clientX - r.left, y = e.clientY - r.top;
  if ($('grid').checked) { x = Math.round(x/20)*20; y = Math.round(y/20)*20; }
  return { x, y };
}

function snapshot() {
  try {
    undoStack.push(canvas.toDataURL('image/png'));
    if (undoStack.length > MAX_UNDO) undoStack.shift();
  } catch (e) { /* ignore */ }
}

function restore(dataUrl) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);
      ctx.restore();
      resolve();
    };
    img.src = dataUrl;
  });
}

function drawLine(x1, y1, x2, y2) {
  ctx.strokeStyle = $('color').value;
  ctx.lineWidth = parseInt($('width').value, 10);
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
}

function drawPreview(x1, y1, x2, y2, dotOnly) {
  octx.clearRect(0, 0, overlay.width, overlay.height);
  octx.save();
  if (!dotOnly) {
    octx.strokeStyle = $('color').value;
    octx.lineWidth = parseInt($('width').value, 10);
    octx.setLineDash([6, 4]);
    octx.globalAlpha = 0.6;
    octx.beginPath();
    octx.moveTo(x1, y1);
    octx.lineTo(x2, y2);
    octx.stroke();
    octx.setLineDash([]);
    octx.globalAlpha = 1;
  }
  octx.fillStyle = $('color').value;
  octx.beginPath();
  octx.arc(x1, y1, 4, 0, Math.PI * 2);
  octx.fill();
  octx.restore();
}

function clearPreview() { octx.clearRect(0, 0, overlay.width, overlay.height); }

canvas.addEventListener('click', e => {
  const p = point(e);

  if (tool === 'bucket') {
    snapshot();
    floodFill(p.x, p.y, $('color').value);
    stop();
    return;
  }

  if (!start) {
    start = p;
    drawPreview(p.x, p.y, p.x, p.y, true);
    return;
  }

  snapshot();
  drawLine(start.x, start.y, p.x, p.y);
  start = $('cont').checked ? p : null;
  if (start) drawPreview(start.x, start.y, start.x, start.y, true);
  else clearPreview();
});

stage.addEventListener('mousemove', e => {
  if (tool !== 'line' || !start) return;
  const p = point(e);
  drawPreview(start.x, start.y, p.x, p.y, false);
});

function stop() { start = null; clearPreview(); }

async function undo() {
  const data = undoStack.pop();
  if (!data) return;
  await restore(data);
  stop();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') stop();
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); }
});

$('undo').onclick = undo;

$('clear').onclick = () => {
  snapshot();
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.restore();
  stop();
};

// ---------- Flood fill (Paint-like) ----------
function floodFill(x, y, fillColor) {
  const dpr = window.devicePixelRatio || 1;
  const px = Math.round(x * dpr);
  const py = Math.round(y * dpr);
  const w = canvas.width, h = canvas.height;
  if (px < 0 || py < 0 || px >= w || py >= h) return;

  const img = ctx.getImageData(0, 0, w, h);
  const data = img.data;
  const i0 = (py * w + px) * 4;
  const tR = data[i0], tG = data[i0+1], tB = data[i0+2], tA = data[i0+3];

  const fR = parseInt(fillColor.slice(1,3), 16);
  const fG = parseInt(fillColor.slice(3,5), 16);
  const fB = parseInt(fillColor.slice(5,7), 16);

  if (tR === fR && tG === fG && tB === fB && tA === 255) return;

  const TOL = 42;
  const matches = (k) => {
    if (tA === 0) return data[k+3] < 50;
    return Math.abs(data[k]   - tR) <= TOL &&
           Math.abs(data[k+1] - tG) <= TOL &&
           Math.abs(data[k+2] - tB) <= TOL &&
           data[k+3] > 0;
  };

  const visited = new Uint8Array(w * h);
  const stack = [[px, py]];

  while (stack.length) {
    const [cx, cy] = stack.pop();
    const ck = cy * w + cx;
    if (visited[ck]) continue;
    if (!matches(ck * 4)) continue;

    let x0 = cx;
    while (x0 > 0 && !visited[cy*w + x0 - 1] && matches(((cy*w + x0 - 1) * 4))) x0--;
    let x1 = cx;
    while (x1 < w - 1 && !visited[cy*w + x1 + 1] && matches(((cy*w + x1 + 1) * 4))) x1++;

    for (let i = x0; i <= x1; i++) {
      visited[cy*w + i] = 1;
      const k = (cy*w + i) * 4;
      data[k]   = fR;
      data[k+1] = fG;
      data[k+2] = fB;
      data[k+3] = 255;
    }

    for (const ny of [cy - 1, cy + 1]) {
      if (ny < 0 || ny >= h) continue;
      let inRun = false;
      for (let i = x0; i <= x1; i++) {
        const k = ny*w + i;
        const ok = !visited[k] && matches(k * 4);
        if (ok) {
          if (!inRun) { stack.push([i, ny]); inRun = true; }
        } else {
          inRun = false;
        }
      }
    }
  }

  ctx.putImageData(img, 0, 0);
}

// ---------- Download as SVG (PNG embedded) ----------
$('download').onclick = () => {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.width / dpr;
  const h = canvas.height / dpr;

  const out = document.createElement('canvas');
  out.width = canvas.width;
  out.height = canvas.height;
  const octx2 = out.getContext('2d');
  octx2.fillStyle = '#ffffff';
  octx2.fillRect(0, 0, out.width, out.height);
  octx2.drawImage(canvas, 0, 0);
  const png = out.toDataURL('image/png');

  const svg =
    `<?xml version="1.0" encoding="UTF-8"?>\n` +
    `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" ` +
    `width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">\n` +
    `<image x="0" y="0" width="${w}" height="${h}" xlink:href="${png}"/>\n` +
    `</svg>`;

  const blob = new Blob([svg], { type: 'image/svg+xml' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'lines.svg';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

// Init
resize();
</script>
</body>
</html>
